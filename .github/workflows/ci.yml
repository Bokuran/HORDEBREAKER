name: JavaScript regression tests

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for file in js/*.js config/*.js tests/*.mjs; do node --check "$file"; done
      - name: Run regression tests
        run: node tests/sanity.mjs

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.51.1
      - name: Real Chrome UI and art smoke test
        run: node tests/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-ui-screenshots
          path: browser-artifacts/
