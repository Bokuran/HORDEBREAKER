name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate game
        run: |
          for file in js/*.js config/*.js tests/*.mjs; do node --check "$file"; done
          node tests/sanity.mjs
  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      # 👇 ЭТОТ ШАГ БЫЛ НЕПРАВИЛЬНЫМ / ОТСУТСТВОВАЛ
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Точка означает, что мы берем все файлы из корневой папки (где лежит index.html)
          path: '.'

      # GitHub sometimes indexes the artifact a few seconds after upload.
      # Allow it to appear before deploy-pages queries the Actions API.
      - name: Allow Pages artifact to become visible
        run: sleep 15

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4